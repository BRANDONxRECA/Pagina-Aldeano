"""Datos del cliente (clients). Solo visible para el personal."""
type ClienteResumen {
  nombre: String!
  telefono: String
}

type ItemPedido {
  productoId: Int!

  """Nombre al momento de la compra (orders)"""
  nombre: String!
  precioUnitario: Int!
  cantidad: Int!
  subtotal: Int!

  """
  Estado actual del producto en inventory (puede ser null si no responde)
  """
  productoActual: Producto
}

type PaginaPedidos {
  pagina: Int!
  tamano: Int!
  total: Int!
  items: [Pedido!]!
}

"""Pago del pedido (payments). Nunca incluye tokens ni claves."""
type Pago {
  estado: String!
  metodo: String!
  monto: Int!
  numeroBoleta: String
}

type Pedido {
  codigo: String!
  estado: String!
  tipoEntrega: String!
  direccionEntrega: String
  subtotal: Int!
  costoDespacho: Int!
  total: Int!
  creadoEn: String!
  items: [ItemPedido!]!

  """Combina payments con el pedido"""
  pago: Pago

  """Solo personal"""
  cliente: ClienteResumen
}

"""Datos públicos del catálogo (inventory)."""
type Producto {
  id: Int!
  nombre: String!
  descripcion: String!
  categoria: String!
  precio: Int!
  disponible: Boolean!
}

type ProductoTop {
  productoId: Int!
  nombre: String!
  unidades: Int!
  ingresos: Int!
}

type Query {
  """
  Historial del cliente autenticado con producto actual y pago (orders+inventory+payments)
  """
  misPedidos(pagina: Int! = 1, tamano: Int! = 10): PaginaPedidos!

  """Resumen de un pedido. Cliente: solo los propios. Personal: cualquiera."""
  pedido(codigo: String!): Pedido

  """Panel del personal: pedidos en curso (PAGADO, PREPARANDO, LISTO)"""
  pedidosActivos(pagina: Int! = 1, tamano: Int! = 20): PaginaPedidos!

  """Reporte de ventas desde el servicio de analítica (solo ADMIN)"""
  reporteVentas(desde: String!, hasta: String!): ReporteVentas!
}

type ReporteVentas {
  desde: String!
  hasta: String!
  pedidosPagados: Int!
  pedidosAnulados: Int!
  ingresos: Int!
  ticketPromedio: Int!
  proporcionDespacho: Float!
  porDia: [VentaDia!]!
  topProductos: [ProductoTop!]!
}

type VentaDia {
  fecha: String!
  pedidos: Int!
  ingresos: Int!
}
